        aux_loss_coef:
          latent_l2: 0.01
        module_config_dict:
          input_dim:
          - actor_obs
          output_dim:
          - robot_action_dim
          layer_config:
            type: MLP
            hidden_dims:
            - 512
            - 256
            - 128
            activation: SiLU
    decoder_distill: true
    diffusion_target_key: diffusion_target
    target_latent_mode: pre_quantization
    diffusion_latent_dim: 64
    diffusion_hand_dim: 2
    diffusion_hand_target_source: reference_motion
    distill_rollout_with_action_mean: false
    ppo_bc_loss_schedule:
      enabled: true
      bc_min_coef: 0.06
      end_iteration: 3000
      adaptive_after_iteration: 1000
    dagger_rollout_mode: fixed
    dagger_student_ratio: 1
    dagger_student_ratio_increment: 0.0
    console_loss_keys:
