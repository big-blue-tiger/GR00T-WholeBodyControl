          cond_dim: 1024
          timestep_dim: 128
          timestep_hidden_dim: 1024
          timestep_feature_dim: 256
          cond_hidden_dims:
          - 512
          denoiser_hidden_dims:
          - 2048
          - 2048
          - 1024
