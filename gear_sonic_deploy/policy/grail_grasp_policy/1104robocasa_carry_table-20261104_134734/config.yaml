          latent_norm_until: null
          num_train_timesteps: 100
          num_inference_steps: 4
          num_timestep_buckets: 1000
          noise_beta_alpha: 1.5
          noise_beta_beta: 1.0
          noise_s: 0.999
          beta_start: 0.0001
          beta_end: 0.02
          diffusion_loss_coef: 1.0
          mlp_hidden_dims:
